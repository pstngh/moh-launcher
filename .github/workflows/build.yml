name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build launcher.app
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          ./bundle.sh "$stage"
          codesign --verify --deep --strict "$stage/launcher.app"
          # The zip contains launcher.app, not a folder and not another zip.
          ditto -c -k "$stage" "$RUNNER_TEMP/launcher-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-macos-arm64
          # The wildcard keeps launcher.app as the top folder. Uploading the
          # app directory itself stores only Contents.
          path: ${{ runner.temp }}/stage/*


      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$RUNNER_TEMP/launcher-macos-arm64.zip"
          tag=v2.0
          notes='Apple silicon, macOS 15 or later.

          Unzip launcher.app into the game folder, next to openmohaa.app and mohbots.app. Connect starts openmohaa.app. Play starts mohbots.app.'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title "launcher.app $tag" --notes "$notes" --latest
          else
            gh release create "$tag" "$asset" --title "launcher.app $tag" --notes "$notes" --latest --target "$GITHUB_SHA"
          fi
